steps:
  # Step 1: Download the latest stable cm binary from official Google Artifact Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts generic download \
          --project=cmoc-prod \
          --location=us \
          --repository=codemender-cli-production \
          --package=cm \
          --version=stable \
          --name=cm-linux-amd64.zip \
          --destination=./
        python3 -m zipfile -e cm-linux-amd64.zip ./
        chmod +x cm

  # Step 2: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/orchestrator:latest'
      - '.'

  # Step 3: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/orchestrator:latest'

  # Step 4: Update the runner Cloud Run Job with the newly pushed image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '${_REPO_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/orchestrator:latest'
      - '--region'
      - '${_REGION}'

  # Step 5: Update the worker Cloud Run Job with the newly pushed image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        REPO_NAME_VAL="${_REPO_NAME}"
        WORKER_JOB="$${REPO_NAME_VAL/-runner/-worker}"
        gcloud run jobs update $${WORKER_JOB} \
          --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/orchestrator:latest \
          --region ${_REGION}

substitutions:
  _REPO_NAME: 'codemender-runner'
  _REGION: 'us-central1'
